<!doctype html>
<html lang="en">
<head>
<!-- Google tag (GTM-5VJ3MXMQ): site visit stats, loads on every page including login -->
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5VJ3MXMQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<title>SCC</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!-- PWA: ติดตั้งเป็นแอปเต็มจอ (Android / iOS / iPadOS) · ไฟล์อยู่ใน public/ -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#07070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- แอปธีมมืด + style.css เว้น safe-area ด้านบนไว้แล้ว → ให้เนื้อหาทะลุใต้แถบสถานะ ตัวอักษรขาว -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCC Fleet">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<!-- Saved theme (ThemeToggle.jsx), set before first paint so light mode does not flash dark -->
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
